<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Finder Sweeps</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f3ee,#14110f);--card:light-dark(#fff,#1f1b18);--ink:light-dark(#1c1916,#efe9e1);--mute:light-dark(#7a726a,#a59c92);--line:light-dark(#e7e1d8,#332d28);--acc:light-dark(#1f6f5c,#4fb79c);--hot:light-dark(#c2410c,#fb8a52);--warn:light-dark(#b45309,#f0a54a);--bad:light-dark(#b91c1c,#f07171);--ok:light-dark(#15803d,#5cc98a);--rev:light-dark(#a16207,#e5b54a)}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:clip}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:#14110f;color:#f6f3ee;padding:10px 14px 0;border-bottom:1px solid #2a2420}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.brand b{font-size:17px}
.scan{font-size:12px;color:#bfb6ab}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#22c55e}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;font:inherit;background:none;border:0;color:#d6cec4;padding:10px 12px;border-radius:8px 8px 0 0;white-space:nowrap;font-size:14px;cursor:pointer;min-height:44px}
nav button.on{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 4px}h2{font-size:16px;margin:22px 0 8px}
.lead{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.t{font-weight:600;line-height:1.3}.deal{display:flex;gap:12px}.deal .ph{flex:none;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--line);display:block}.deal .ph img{width:100%;height:100%;object-fit:cover;display:block}
.muted{color:var(--mute);font-size:13px}
.nums{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0;font-size:13px}.nums b{font-size:15px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.3px}
.Hot,.ALERT{color:var(--hot)}.Promising{color:var(--ok)}.Selective{color:var(--warn)}.Avoid,.REJECT{color:var(--bad)}.Unverified{color:var(--mute)}.REVIEW,.OFFER{color:var(--rev)}
.profit{color:var(--hot)}
.flag{font-size:12px;padding:2px 0;color:var(--warn)}
.actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:12px}
.kpi .big{font-size:clamp(22px,5vw,28px);font-weight:700;line-height:1.1}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Deal Finder</b><span class="scan"><span class="dot"></span><span id="last">Last sweep —</span></span></div>
  <nav id="tabs">
    <button data-v="deals" class="on">Deals</button>
    <button data-v="offer">Make an offer</button>
    <button data-v="saved">Saved</button>
    <button data-v="rejected">Rejected</button>
    <button data-v="styles">Styles</button>
    <button data-v="sweeps">Sweeps</button>
  </nav>
</header>
<main id="app"></main>

<script>
const D=JSON.parse(document.getElementById('sweep-data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>typeof v==='number'?'$'+v.toFixed(2):'—';
const pct=v=>typeof v==='number'?Math.round(v*100)+'%':'—';
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);if(isNaN(m))return'';if(m<1)return'just now';if(m<60)return m+' min ago';if(m<2880)return Math.round(m/60)+' h ago';return Math.round(m/1440)+' d ago'};
const styleBy=Object.fromEntries(D.styles.map(s=>[s.slug,s]));
let marks={};try{marks=JSON.parse(localStorage.getItem('df-marks')||'{}')}catch(e){}
const saveMarks=()=>{try{localStorage.setItem('df-marks',JSON.stringify(marks))}catch(e){}};
let view='deals';
$('#last').textContent='Last sweep '+ago(D.updated);

const card=d=>{const st=styleBy[d.style]||{};const m=marks[d.id];
return `<div class="card deal">${d.img?`<a class="ph" href="${esc(d.url)}" target="_blank" rel="noopener"><img src="${d.img}" alt="Listing photo" loading="lazy"></a>`:''}<div style="flex:1">
 <div><span class="pill ${d.decision}">${d.decision}</span> <span class="muted">${esc(d.marketplace)} · found ${ago(d.found)}</span>${m?` <span class="muted">· ${m}</span>`:''}</div>
 <div class="t"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
 ${st.brand?`<div class="muted">${esc(st.brand)} — ${esc(st.name)}</div>`:''}
 <div class="nums">
  <span>All-in <b>${money(d.total)}</b></span>
  <span>Est. resale <b>${money(d.resale)}</b></span>
  <span class="profit">Net profit <b>+${money(d.net_profit)}</b></span>
  ${d.offer_at?`<span>Offer <b>${money(d.offer_at)}</b></span>`:''}
 </div>
 ${(d.reasons||new Array()).map(r=>`<div class="muted">✓ ${esc(r)}</div>`).join('')}
 ${(d.flags||new Array()).map(f=>`<div class="flag">⚠ ${esc(f)}</div>`).join('')}
 <div class="actions">
Open listing ↗
Save
Bought
Pass

`};
window.mark=(id,val)=>{marks[id]=val;saveMarks();render()};
function render(){
const app=$('#app');
const active=D.deals.filter(d=>marks[d.id]!=='passed'&&marks[d.id]!=='bought');
const alerts=active.filter(d=>d.decision==='ALERT');
const offers=active.filter(d=>d.decision==='OFFER'||d.decision==='REVIEW');
const lastSweep=D.sweeps.at(0)||{};
if(view==='deals'){
app.innerHTML=<h1>Top deals right now</h1><p class="lead">Every rule passed: ≤ $50 all-in, ≥ $40 conservative profit, verified style, and every photo checked.</p> <div class="kpis"> <div class="card kpi"><div class="muted">Buy alerts</div><div class="big profit">${alerts.length}</div></div> <div class="card kpi"><div class="muted">Offer / Review</div><div class="big">${offers.length}</div></div> <div class="card kpi"><div class="muted">Pages read last sweep</div><div class="big">${lastSweep.pages||0}</div></div> <div class="card kpi"><div class="muted">Profitable styles</div><div class="big">${D.styles.length}</div></div> </div> ${lastSweep.notes?${esc(lastSweep.notes)}:''} ${alerts.length?${alerts.map(card).join('')}:''} <h2>Listings I checked that didn't pass</h2> <div class="grid">${D.rejected.slice(0,12).map(r=>NOT RECOMMENDED ${esc(r.marketplace)}${esc(r.title)}✘ ${esc(r.why)}Open listing ↗).join('')}</div>;
} else if(view==='offer'){
app.innerHTML=<h1>Make an offer & Review</h1><div class="grid">${offers.length?offers.map(card).join(''):'<p class="muted">No offer opportunities right now.</p>'}</div>;
} else if(view==='saved'){
const saved=D.deals.filter(d=>marks[d.id]==='saved'||marks[d.id]==='bought');
app.innerHTML=<h1>Saved & Bought</h1><div class="grid">${saved.length?saved.map(card).join(''):'<p class="muted">Nothing saved yet.</p>'}</div>;
} else if(view==='rejected'){
app.innerHTML=<h1>Rejected listings (${D.rejected.length})</h1><div class="grid">${D.rejected.map(r=>REJECTED ${esc(r.marketplace)}${esc(r.title)}✘ ${esc(r.why)}Open ↗).join('')}</div>;
} else if(view==='styles'){
app.innerHTML=<h1>Tracked styles (${D.styles.length})</h1><div class="tablewrap"><table><thead><tr><th>Brand & Style</th><th>Class</th><th class="r">Conservative</th><th class="r">90d Sold</th><th class="r">Sell-through</th><th class="r">Max All-In</th></tr></thead><tbody>${D.styles.map(s=>${esc(s.brand)} — ${esc(s.name)}${s.cls}${money(s.conservative)}${s.sold90}${pct(s.sell_through)}${money(s.max_all_in)}).join('')}</tbody></table></div>;
} else if(view==='sweeps'){
app.innerHTML=<h1>Sweep history</h1><div class="tablewrap"><table><thead><tr><th>Time</th><th>Sites</th><th>Searched</th><th class="r">Checked</th><th class="r">Alerts</th><th>Notes</th></tr></thead><tbody>${D.sweeps.map(w=>${ago(w.at)}${(w.sites||new Array()).join(', ')}${(w.searched||new Array()).join(', ')}${w.candidates}${w.alerts}${esc(w.notes)}).join('')}</tbody></table></div>;
}
}
$('#tabs').addEventListener('click',e=>{if(e.target.dataset.v){view=e.target.dataset.v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));render()}});
render();
