name: Hourly Deal Finder Sweep

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Deal Finder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python -c 'open("sweep.py","w").write(open("sweep.py").read().replace("\t","    "))'
          python sweep.py
      - name: Save updated dashboard
        run: |
          git config user.name "Deal Finder Bot"
          git config user.email "bot@://github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sweep data" && git push)
